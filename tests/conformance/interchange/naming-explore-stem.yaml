      - {name: guardrailTemperature, value: "0.0"}
      - {name: guardrailMaxTokens, value: 50}
      - {name: guardrailKind, value: "llm-judge"}
      - {name: responseSchema, value: "advice-v1"}
    expected: "advisorModel-mistral-small-4_advisorSystemPrompt-You_advise_travellers_on-4e92_advisorTemperature-0.2_advisorMaxTokens-200_guardrailModel-mistral-small-4_guardrailSystemPrompt-You_check_a_rep-247b4759"
  - id: ten-factors-late-difference
    note: "As ten-factors with responseSchema advice-v2: the same prefix, a distinct hash."
    factors:
      - {name: advisorModel, value: "mistral-small-4"}
      - {name: advisorSystemPrompt, value: "You advise travellers on the health risks of their destination."}
      - {name: advisorTemperature, value: "0.2"}
      - {name: advisorMaxTokens, value: 200}
      - {name: guardrailModel, value: "mistral-small-4"}
      - {name: guardrailSystemPrompt, value: "You check a reply that an advisor wrote for unsafe advice."}
      - {name: guardrailTemperature, value: "0.0"}
      - {name: guardrailMaxTokens, value: 50}
      - {name: guardrailKind, value: "llm-judge"}
      - {name: responseSchema, value: "advice-v2"}
    expected: "advisorModel-mistral-small-4_advisorSystemPrompt-You_advise_travellers_on-4e92_advisorTemperature-0.2_advisorMaxTokens-200_guardrailModel-mistral-small-4_guardrailSystemPrompt-You_check_a_rep-a1b572d2"
