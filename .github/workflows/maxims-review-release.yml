name: Maxims review (release panel)

# Deeper, four-persona maxims review for release preparation.
#
# feotest has no `release/**` branch and no dev-suffix version convention:
# `Cargo.toml` sits at the last released version between releases, and a
# release bumps `version` and CHANGELOG.md in one commit, then tags `vX.Y.Z`
# (see the release preconditions in the repo guidance). So this panel keys on
# the one act every release must perform — a *change* to the package version —
# by comparing the PR head's version against the base branch's. A
# dependency-only Cargo.toml edit does not fire it. Because the release flow
# does not require the bump to travel by PR, the release preconditions also
# allow forcing the panel against any PR via a manual `workflow_dispatch`.
#
# The personas and maxims are fetched from a private source repo — not in this
# public tree. See DIR-FEO-QA-review-agents in the orchestrator.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - Cargo.toml
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: true

jobs:
  gate:
    # Run the panel only when this PR changes the package version — the
    # release-preparation act. A manual dispatch always runs.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the base ref's Cargo.toml is available to diff.
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "manual dispatch — running panel"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head_ver="$(grep -m1 -E '^version = ' Cargo.toml | cut -d'"' -f2)"
          base_ver="$(git show "$BASE_SHA:Cargo.toml" | grep -m1 -E '^version = ' | cut -d'"' -f2)"
          if [ "$head_ver" != "$base_ver" ]; then
            echo "version change $base_ver -> $head_ver — running panel"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "version unchanged ($head_ver) — not a release PR, skipping panel"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  panel:
    needs: gate
    # Skip on fork PRs (secrets, and thus the private source, are withheld).
    if: >-
      needs.gate.outputs.run == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        persona: [structural, type-state, interface-error, rust-idiom]
    steps:
      - name: Checkout the PR under review
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch the private QA source (maxims + personas)
        uses: actions/checkout@v4
        with:
          repository: mavai-org/mavai-orchestrator
          token: ${{ secrets.MAXIMS_SOURCE_TOKEN }}
          path: .qa-source
          sparse-checkout: |
            .claude-submodules/feotest-MAXIMS.md
            plan/qa/feotest
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: ${{ matrix.persona }} maxims review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read .qa-source/plan/qa/feotest/maxims-review-${{ matrix.persona }}.md and
            follow it exactly. The maxims are in
            .qa-source/.claude-submodules/feotest-MAXIMS.md. Review the diff of
            PR #${{ github.event.pull_request.number || github.event.inputs.pr }}
            through this persona's lens only, and post one advisory review section
            headed with the persona name. Do not print the maxims or persona files.
